<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Transcription Testing Interface</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            padding: 20px;
            margin: 0;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .controls {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        .meta-info {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #64748b;
        }

        .meta-info span {
            margin-right: 15px;
        }

        audio {
            width: 100%;
            margin-top: 5px;
        }

        .tip {
            font-size: 0.85rem;
            color: #0f766e;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 10px;
        }

        .transcript-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .column {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 20px;
        }

        .column h3 {
            margin-top: 0;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }

        .agent-column h3 {
            color: #0284c7;
        }

        .customer-column h3 {
            color: #e11d48;
        }

        .words-container {
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .word {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 2px;
            color: #475569;
        }

        .word:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        /* Flat yellow highlighter */
        .word.active {
            background-color: #fef08a;
            color: #000000;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Player Controls -->
    <div class="controls">
        <div class="meta-info">
            <span>Accent: <strong>en-CA</strong></span>
            <span>Domain: <strong>Banking</strong></span>
            <span>Target File: <strong>call_1_mixed.wav (Stereo)</strong></span>
        </div>
        <audio id="audio-player" controls>
            <source src="./data/apptek/call_1_mixed.wav" type="audio/wav">
            Your browser does not support the audio element.
        </audio>
        <div class="tip">
            <strong>Testing Note:</strong> Click any word in the transcripts below to seek the player directly to that time offset.
        </div>
    </div>

    <!-- Dual Columns -->
    <div class="transcript-grid">
        <!-- Agent -->
        <div class="column agent-column">
            <h3>Agent Channel (Left)</h3>
            <div class="words-container" id="agent-transcript"></div>
        </div>

        <!-- Customer -->
        <div class="column customer-column">

    </div>

        const player = document.getElementById("audio-player");
        const agentContainer = document.getElementById("agent-transcript");
        const customerContainer = document.getElementById("customer-transcript");

        // Render words into spans
        function renderTranscript(channel, container) {
            const words = transcriptData[channel];
            container.innerHTML = "";
            
            words.forEach((item, index) => {
                const span = document.createElement("span");
                span.className = "word";
                span.id = `${channel}-word-${index}`;
                span.innerText = item.word;
                
                // Click-to-seek logic
                span.addEventListener("click", () => {
                    player.currentTime = item.start;
                    player.play();
                });
                
                container.appendChild(span);
                container.appendChild(document.createTextNode(" "));
            });
        }

        renderTranscript("agent", agentContainer);
        renderTranscript("customer", customerContainer);

        // Track active word highlights during audio playback
        player.addEventListener("timeupdate", () => {
            const currentTime = player.currentTime;
            
            // Agent Highlight
            transcriptData.agent.forEach((item, index) => {
                const span = document.getElementById(`agent-word-${index}`);
                if (span) {
                    if (currentTime >= item.start && currentTime <= item.end) {
                        span.classList.add("active");
                    } else {
                        span.classList.remove("active");
                    }
                }
            });

            // Customer Highlight
            transcriptData.customer.forEach((item, index) => {
                const span = document.getElementById(`customer-word-${index}`);
                if (span) {

                    } else {
