<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Transcription Tester</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top bar ───────────────────────────────────── */
        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 20px;
            flex-shrink: 0;
        }

        .topbar-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .topbar-meta {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        .topbar-meta span { margin-right: 12px; }

        /* ── Player bar ─────────────────────────────────── */
        .playerbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 10px 20px;
            flex-shrink: 0;
        }

        audio {
            width: 100%;
            height: 32px;
        }

        .player-hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        /* ── Speaker legend ─────────────────────────────── */
        .legend {
            display: flex;
            justify-content: space-between;
            padding: 8px 20px;
            font-size: 0.78rem;
            color: #64748b;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .legend-left { display: flex; align-items: center; gap: 6px; }
        .legend-right { display: flex; align-items: center; gap: 6px; }

        .dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-agent    { background: #0284c7; }
        .dot-customer { background: #64748b; }

        /* ── Chat area ──────────────────────────────────── */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .bubble-row {
            display: flex;
            width: 100%;
        }

        .bubble-row.agent    { justify-content: flex-start; }
        .bubble-row.customer { justify-content: flex-end; }

        .bubble {
            max-width: 62%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.65;
            position: relative;
        }

        /* Agent: left, blue tint */
        .bubble-row.agent .bubble {
            background: #e0f2fe;
            border-top-left-radius: 4px;
        }

        /* Customer: right, light grey */
        .bubble-row.customer .bubble {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-top-right-radius: 4px;
        }

        .bubble-speaker {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .bubble-row.agent    .bubble-speaker { color: #0284c7; }
        .bubble-row.customer .bubble-speaker { color: #64748b; }

        .bubble-time {
            font-size: 0.68rem;
            color: #94a3b8;
            margin-top: 5px;
            text-align: right;
        }

        /* ── Word tokens ─────────────────────────────────── */
        .word {
            cursor: pointer;
            padding: 1px 3px;
            border-radius: 3px;
            color: inherit;
            display: inline;
        }

        .word:hover {
            background: rgba(0,0,0,0.07);
        }

        .word.active {
            background: #fef08a;
            color: #000;
            font-weight: 500;
        }

        /* ── Loading / error ─────────────────────────────── */
        #status {
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Top bar -->
    <div class="topbar">
        <div class="topbar-title">Call Transcription Tester</div>
        <div class="topbar-meta">
            <span>Model: <strong>whisper-small (int8)</strong></span>
            <span>File: <strong>call_1_mixed.wav</strong></span>
            <span>Domain: <strong>Banking · en-CA</strong></span>
        </div>
    </div>

    <!-- Audio player -->
    <div class="playerbar">
        <audio id="audio-player" controls>
            <source src="./data/apptek/call_1_mixed.wav" type="audio/wav">
        </audio>
        <div class="player-hint">Click any word in the transcript to seek · words highlight in real time</div>
    </div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-left">
            <span class="dot dot-agent"></span>
            <span>Emily — Agent</span>
        </div>
        <div class="legend-right">
            <span>James — Customer</span>
            <span class="dot dot-customer"></span>
        </div>
    </div>

    <!-- Chat thread -->
    <div id="chat">
        <div id="status">Loading transcript…</div>
    </div>

    <script>
        const player = document.getElementById("audio-player");
        const chat   = document.getElementById("chat");

        // Global word registry: id -> { start, end }
        const wordRegistry = {};

        // Group a flat word array into utterances by inter-word gap
        function groupIntoUtterances(words, gapSecs = 3.0) {
            if (!words.length) return [];
            const utts = [];
            let cur = { start: words[0].start, end: words[0].end, words: [words[0]] };
            for (let i = 1; i < words.length; i++) {
                const gap = words[i].start - cur.end;
                if (gap > gapSecs) {
                    utts.push(cur);
                    cur = { start: words[i].start, end: words[i].end, words: [words[i]] };
                } else {
                    cur.words.push(words[i]);
                    cur.end = words[i].end;
                }
            }
            utts.push(cur);
            return utts;
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60).toString().padStart(2, "0");
            return `${m}:${s}`;
        }

        function renderBubble(speaker, utterance, uttIndex) {
            const row = document.createElement("div");
            row.className = `bubble-row ${speaker}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";

            // Speaker label
            const label = document.createElement("div");
            label.className = "bubble-speaker";
            label.textContent = speaker === "agent" ? "Emily" : "James";
            bubble.appendChild(label);

            // Word spans
            const textNode = document.createElement("div");
            utterance.words.forEach((item, wordIdx) => {
                const id = `${speaker}-${uttIndex}-${wordIdx}`;
                const span = document.createElement("span");
                span.className = "word";
                span.id = id;
                span.textContent = item.word;
                span.addEventListener("click", () => {
                    player.currentTime = item.start;
                    player.play();
                });
                wordRegistry[id] = { start: item.start, end: item.end };
                textNode.appendChild(span);
                textNode.appendChild(document.createTextNode(" "));
            });
            bubble.appendChild(textNode);

            // Timestamp footer
            const timeEl = document.createElement("div");
            timeEl.className = "bubble-time";
            timeEl.textContent = formatTime(utterance.start);
            bubble.appendChild(timeEl);

            row.appendChild(bubble);
            return row;
        }

        // Highlight active words based on current playback time
        player.addEventListener("timeupdate", () => {
            const t = player.currentTime;
            Object.entries(wordRegistry).forEach(([id, { start, end }]) => {
                const span = document.getElementById(id);
                if (!span) return;
                if (t >= start && t <= end) {
                    span.classList.add("active");
                } else {
                    span.classList.remove("active");
                }
            });
        });

        // Load and render
        fetch("./frontend/transcript_data.json")
            .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(data => {
                // Update model label dynamically
                const modelEl = document.querySelector(".topbar-meta strong");
                if (modelEl && data.model) {
                    modelEl.textContent = data.model;
                }

                const agentUtts    = groupIntoUtterances(data.agent, 3.0)
                    .map((u, i) => ({ ...u, speaker: "agent",    uttIndex: i }));
                const customerUtts = groupIntoUtterances(data.customer, 3.0)
                    .map((u, i) => ({ ...u, speaker: "customer", uttIndex: i }));

                // Merge and sort chronologically
                const all = [...agentUtts, ...customerUtts].sort((a, b) => a.start - b.start);

                chat.innerHTML = "";
                all.forEach(utt => {
                    chat.appendChild(renderBubble(utt.speaker, utt, utt.uttIndex));
                });
            })
            .catch(err => {
                document.getElementById("status").textContent =
                    `Error loading transcript_data.json: ${err.message}. Serve via http.server or similar.`;
            });
    </script>
</body>
</html>
