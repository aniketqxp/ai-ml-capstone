server {
    listen 80;
    server_name _;
    client_max_body_size 1g;

    root /usr/share/nginx/html;
    index index.html;

    location /evaluation/ {
        proxy_pass http://backend:8000;
    }

    location = /calls/ingest {
        proxy_pass http://backend:8000;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /calls/analyze {
        proxy_pass http://backend:8000;
    }

    location = /calls/catalog {
        proxy_pass http://backend:8000;
    }

    location ~ ^/calls/[^/]+/(status|cancel)$ {
        proxy_pass http://backend:8000;
    }

    # Artifact API. A path without .json is a React call-detail route and must
    # fall through to index.html below.
    location ~ ^/calls/[^/]+\.json$ {
        proxy_pass http://backend:8000;
    }

    location /sentence_segments/ {
        proxy_pass http://backend:8000;
    }

    location /sentiment/ {
        proxy_pass http://backend:8000;
    }

    location /audio/ {
        proxy_pass http://backend:8000;
    }

    location = /calls_index.json {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
