services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data/audio:/data/audio
      - ./ml-services:/ml-services
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  ml-services:
    build:
      context: ./ml-services
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./ml-services:/workspace
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY}