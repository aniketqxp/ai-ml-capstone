services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data/audio:/data/audio
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  ml-services:
    build:
      context: ./ml-services
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./ml-services:/workspace
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY}

  # Optional local Postgres for offline backend dev/testing.
  # Not started by default — run `docker compose --profile local-db up`
  # and point DATABASE_URL in .env to postgresql://postgres:postgres@db:5432/capstone
  # if you don't want to develop against the shared Supabase Postgres directly.
  db:
    image: postgres:15-alpine
    profiles: ["local-db"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=capstone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capstone"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
